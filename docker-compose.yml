# Pulso production stack: Caddy (HTTPS) + Next server + Postgres. See DEPLOY.md.
# Sensitive values live in a local .env next to this file.

services:
  db:
    image: postgres:16@sha256:be01cf82fc7dbba824acf0a82e150b4b360f3ff93c6631d7844af431e841a95c
    container_name: pulso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: pulso
    volumes:
      - pulso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d pulso']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${PULSO_IMAGE:-pulso:local}
    build:
      context: .
      args:
        PULSO_GIT_SHA: ${PULSO_GIT_SHA:-unknown}
    container_name: pulso-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:${POSTGRES_PASSWORD}@db:5432/pulso?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Falta AUTH_SECRET en .env}
      WORKLOG_ENCRYPTION_KEY: ${WORKLOG_ENCRYPTION_KEY:?Falta WORKLOG_ENCRYPTION_KEY en .env}
      NODE_ENV: production
      PORT: '3000'
      PULSO_APP_URL: ${PULSO_APP_URL:?Falta PULSO_APP_URL en .env}
      PULSO_MARKETING_ORIGIN: ${PULSO_MARKETING_ORIGIN:?Falta PULSO_MARKETING_ORIGIN en .env}
      GOOGLE_GMAIL_SENDER: ${GOOGLE_GMAIL_SENDER:?Falta GOOGLE_GMAIL_SENDER en .env}
      PULSO_CONTACT_RECIPIENT: ${PULSO_CONTACT_RECIPIENT:-}
      PULSO_PUBLIC_REGISTRATION_ENABLED: 'false'
      PULSO_PERSONAL_API_ENABLED: 'false'
      PULSO_PERSONAL_ACCOUNT_AI_ENABLED: ${PULSO_PERSONAL_ACCOUNT_AI_ENABLED:-false}
      PULSO_PERSONAL_ACCOUNT_AI_ALLOWED_EMAILS: ${PULSO_PERSONAL_ACCOUNT_AI_ALLOWED_EMAILS:-}
      PULSO_PERSONAL_ACCOUNT_AI_GEMINI_API_KEY: ${PULSO_PERSONAL_ACCOUNT_AI_GEMINI_API_KEY:-}
      PULSO_PERSONAL_ACCOUNT_AI_DATA_TERMS_ACK: ${PULSO_PERSONAL_ACCOUNT_AI_DATA_TERMS_ACK:-}
      PULSO_PERSONAL_ACCOUNT_AI_MODEL: ${PULSO_PERSONAL_ACCOUNT_AI_MODEL:-gemini-3.1-flash-lite}
      PULSO_PERSONAL_ACCOUNT_AI_RATE_LIMIT: ${PULSO_PERSONAL_ACCOUNT_AI_RATE_LIMIT:-20}
      PULSO_PERSONAL_ACCOUNT_AI_RATE_WINDOW_MS: ${PULSO_PERSONAL_ACCOUNT_AI_RATE_WINDOW_MS:-60000}
      LLM_ALLOWED_PUBLIC_HOSTS: ${LLM_ALLOWED_PUBLIC_HOSTS:-}
      LLM_ALLOWED_PRIVATE_HOSTS: ${LLM_ALLOWED_PRIVATE_HOSTS:-}
      PULSO_BILLING_PROVIDER: ${PULSO_BILLING_PROVIDER:-MERCADO_PAGO_MOCK}
      BILLING_MOCK_WEBHOOK_SECRET: ${BILLING_MOCK_WEBHOOK_SECRET:-}
      PULSO_PRICE_VERSION: ${PULSO_PRICE_VERSION:-}
      PULSO_USD_ARS_RATE: ${PULSO_USD_ARS_RATE:-}
      PULSO_PRICE_VALID_UNTIL: ${PULSO_PRICE_VALID_UNTIL:-}
      MERCADO_PAGO_MODE: ${MERCADO_PAGO_MODE:-TEST}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
      PULSO_MERCADO_PAGO_LIVE_ENABLED: ${PULSO_MERCADO_PAGO_LIVE_ENABLED:-false}
      PULSO_MERCADO_PAGO_CHECKOUT_ENABLED: ${PULSO_MERCADO_PAGO_CHECKOUT_ENABLED:-false}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    # Sin puerto al host: sólo Caddy queda expuesto. Si traés tu propio reverse
    # proxy, comentá el servicio `caddy` y descomentá:
    # ports:
    #   - '${APP_PORT:-3000}:3000'

  migrate:
    image: ${PULSO_IMAGE:-pulso:local}
    profiles: ['ops']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:${POSTGRES_PASSWORD}@db:5432/pulso?schema=public
      NODE_ENV: production
    command: ['./docker-migrate.sh']
    restart: 'no'

  email-worker:
    image: ${PULSO_IMAGE:-pulso:local}
    container_name: pulso-email-worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:${POSTGRES_PASSWORD}@db:5432/pulso?schema=public
      WORKLOG_ENCRYPTION_KEY: ${WORKLOG_ENCRYPTION_KEY:?Falta WORKLOG_ENCRYPTION_KEY en .env}
      NODE_ENV: production
      PULSO_EMAIL_PROVIDER: ${PULSO_EMAIL_PROVIDER:?Falta PULSO_EMAIL_PROVIDER en .env}
      PULSO_EMAIL_BATCH_SIZE: ${PULSO_EMAIL_BATCH_SIZE:-20}
      GOOGLE_GMAIL_CLIENT_ID: ${GOOGLE_GMAIL_CLIENT_ID:?Falta GOOGLE_GMAIL_CLIENT_ID en .env}
      GOOGLE_GMAIL_CLIENT_SECRET: ${GOOGLE_GMAIL_CLIENT_SECRET:?Falta GOOGLE_GMAIL_CLIENT_SECRET en .env}
      GOOGLE_GMAIL_REFRESH_TOKEN_ENCRYPTED: ${GOOGLE_GMAIL_REFRESH_TOKEN_ENCRYPTED:?Falta GOOGLE_GMAIL_REFRESH_TOKEN_ENCRYPTED en .env}
      GOOGLE_GMAIL_SENDER: ${GOOGLE_GMAIL_SENDER:?Falta GOOGLE_GMAIL_SENDER en .env}
    command: ['sh', '-c', 'while true; do pnpm email:worker:once; sleep 15; done']

  # Reverse proxy + HTTPS automático (Let's Encrypt). Servís en https://${DOMAIN}.
  caddy:
    image: caddy:2@sha256:af5fdcd76f2db5e4e974ee92f96ee8c0fc3edb55bd4ba5032547cbf3f65e486d
    container_name: pulso-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: "${DOMAIN:?Falta DOMAIN en .env, ej 2-25-184-183.nip.io o tu dominio}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pulso-db-data:
  caddy-data:
  caddy-config:
