# Pulso — stack de producción (app + Postgres). Ver DEPLOY.md.
# Variables sensibles en un .env junto a este archivo (ver .env.docker.example).

services:
  db:
    image: postgres:16
    container_name: pulso-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: pulso
    volumes:
      - pulso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d pulso']
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: pulso-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pulso:${POSTGRES_PASSWORD}@db:5432/pulso?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?Falta AUTH_SECRET en .env}
      WORKLOG_ENCRYPTION_KEY: ${WORKLOG_ENCRYPTION_KEY:?Falta WORKLOG_ENCRYPTION_KEY en .env}
      # IA opcional para el pulso/sugerencias. Sin esto: heurístico/mock (no rompe).
      LLM_PROVIDER: ${LLM_PROVIDER:-MOCK}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      NODE_ENV: production
      PORT: '3000'
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  pulso-db-data:
